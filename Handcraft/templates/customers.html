<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers | ArtisanCrafts Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../static/style.css">
</head> 

<body class="admin-body">
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <a href="#">Artisan<span>Crafts</span></a>
                <span class="admin-badge">Admin</span>
            </div>
            <nav class="admin-nav">
                <a href="{{ url_for('admin') }}"><i class="fa-solid fa-box"></i> Products</a>
                <a href="{{ url_for('admin') }}"><i class="fa-solid fa-box"></i> orders</a>
                <a href="{{ url_for('customers') }}" class="active"><i class="fa-solid fa-users"></i> Customers</a>
            </nav>
            <div class="admin-logout">
                <a href="{{ url_for('logout') }}"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-header">
                <h2>Registered Customers</h2>
                <div class="admin-user">
                    <span>Welcome, Admin</span>
                    <i class="fa-solid fa-circle-user"></i>
                </div>
            </header>

            <div class="admin-content">
                <div class="admin-table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Full Name</th>
                                <th>Email</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for c in customers %}
                            <tr>
                                <td>{{ c[0] }}</td>
                                <td>{{ c[1] }}</td>
                                <td>{{ c[2] }}</td>
                            </tr>
                            {% else %}
                            <tr>
                                <td colspan="3" style="text-align:center;">No customers registered yet</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
